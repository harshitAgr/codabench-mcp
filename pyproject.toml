[project]
name = "codabench-mcp"
version = "0.1.1"
description = "MCP server for the Codabench REST API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Harshit Agrawal", email = "harshitbme@gmail.com" },
]
keywords = ["mcp", "codabench", "model-context-protocol", "benchmarks", "claude", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
urls = { Homepage = "https://github.com/harshitAgr/codabench-mcp", Repository = "https://github.com/harshitAgr/codabench-mcp", Issues = "https://github.com/harshitAgr/codabench-mcp/issues" }
dependencies = [
    "mcp>=1.30,<2",
    "httpx>=0.27.0",
]

[project.scripts]
codabench-mcp = "codabench_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codabench_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
